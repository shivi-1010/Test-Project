<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PetStay — Book via Chat</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --muted: #94a3b8;
      --text: #e5e7eb;
      --ring: #1f2937;
      --bubble-user: #1f2937;
      --bubble-bot: #0b1220;
      --primary: #6d28d9;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 800px at 10% -10%, #1b1f3a 0%, transparent 50%),
                  radial-gradient(1200px 800px at 110% 10%, #0a2a3a 0%, transparent 50%), var(--bg);
      color: var(--text);
    }
    .container { max-width: 1200px; margin: 40px auto; padding: 0 16px; }
    .grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 20px; }
    .card {
      background: linear-gradient(180deg, #0d1223 0%, #0b0f1d 100%);
      border: 1px solid var(--ring);
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.02);
      overflow: hidden;
    }
    .card-header {
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--ring); padding: 16px 18px;
    }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #10b981; box-shadow: 0 0 16px #10b981;
    }
    .title { font-weight: 700; letter-spacing: .2px; }
    .chat { height: clamp(520px, 70vh, 720px); display: grid; grid-template-rows: 1fr auto; }
    .log {
      overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px;
    }
    .msg {
      max-width: 72ch; width: fit-content; padding: 12px 14px; border-radius: 14px;
      line-height: 1.4; border: 1px solid var(--ring); white-space: pre-wrap;
      box-shadow: 0 6px 18px rgba(0,0,0,.25);
    }
    .msg.bot { background: var(--bubble-bot); border-color: #0f172a; }
    .msg.user {
      margin-left: auto; background: var(--bubble-user); border-color: #111827;
    }
    .inputbar {
      display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 12px; border-top: 1px solid var(--ring);
    }
    .inputbar input {
      width: 100%; padding: 14px; border-radius: 12px; background: #0b1020; color: var(--text);
      border: 1px solid var(--ring); outline: none;
    }
    .btn {
      padding: 12px 16px; border-radius: 12px; border: 1px solid #3b0764;
      background: linear-gradient(180deg, #6d28d9, #5b21b6); color: #fff; font-weight: 600;
      cursor: pointer;
    }
    .secondary {
      display: inline-block; margin-top: 12px; padding: 12px 18px; border-radius: 12px;
      background: #0f172a; color: #e2e8f0; border: 1px solid #334155; text-decoration: none;
    }
    .side { display: grid; grid-template-rows: auto 1fr; gap: 16px; }
    .panel { border-top: 1px solid var(--ring); padding: 16px 18px; }
    .muted { color: var(--muted); }
    @media (max-width: 960px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="grid">
      <section class="card chat">
        <header class="card-header">
          <span class="dot" aria-hidden="true"></span>
          <div class="title">PetStay — Book via Chat</div>
        </header>

        <div id="chat-log" class="log" aria-live="polite" aria-label="Chat transcript">
          <div class="msg bot">Hi! I can help you start a pet stay booking.</div>
          <div class="msg user">I’d like to book a pet stay.</div>
          <div class="msg bot">Great. Tell me your pet name and preferred dates, or continue to the booking form.</div>
        </div>

        <div class="inputbar">
          <input id="chat-input" type="text" placeholder="Type a message..." aria-label="Chat input" />
          <button id="chat-send" class="btn" type="button">Send</button>
        </div>
      </section>

      <aside class="card side">
        <div class="panel" style="padding-top:0">
          <h4>Status</h4>
          <div class="muted">Demo assistant ready</div>
          <a class="secondary" href="new-booking.html">Continue to booking form</a>
        </div>
      </aside>
    </div>
  </div>

  <script>
    const chatLog = document.getElementById('chat-log');
    const chatInput = document.getElementById('chat-input');
    const chatSend = document.getElementById('chat-send');

    function addMessage(type, text) {
      const msg = document.createElement('div');
      msg.className = `msg ${type}`;
      msg.textContent = text;
      chatLog.appendChild(msg);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    chatSend.addEventListener('click', () => {
      const message = chatInput.value.trim();
      if (!message) return;

      addMessage('user', message);
      chatInput.value = '';

      const responses = [
        'Thanks! I’ve noted that request. Please continue with the booking form to finish your reservation.',
        'That works for us. Your pet stay request is ready to be submitted from the booking form.',
        'Perfect. We can help with that. Please complete the booking details to confirm your stay.'
      ];

      const answer = responses[Math.floor(Math.random() * responses.length)];
      setTimeout(() => addMessage('bot', answer), 250);
    });

    chatInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        chatSend.click();
      }
    });
  </script>
</body>
</html>
