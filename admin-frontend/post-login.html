<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #eef7ff, #f5f3ff);
      font-family: Arial, sans-serif;
      color: #111827;
    }
    .card {
      width: min(520px, calc(100% - 32px));
      background: #fff;
      border: 1px solid #dbe2ee;
      border-radius: 18px;
      padding: 32px 28px;
      box-shadow: 0 14px 40px rgba(15, 23, 42, 0.08);
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: clamp(1.8rem, 3vw, 2.2rem); }
    p {
      margin: 0; color: #4b5563; line-height: 1.6;
    }
    .tag {
      display: inline-block; margin-top: 18px; padding: 8px 12px; border-radius: 999px;
      background: #eef3ff; color: #1f5ecb; font-weight: 700; font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Admin Access</h1>
    <p>This is a static demo page. Authentication and redirect logic have been disabled.</p>
    <div class="tag">Static mode</div>
    <div style="margin-top: 22px;">
      <a href="admin_dashboard.html" style="display:inline-block; padding:12px 20px; background:#2563eb; color:#fff; border-radius:10px; text-decoration:none; font-weight:700;">Open Dashboard</a>
    </div>
  </div>
</body>
</html>
