<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Bookings | PetStay Admin Panel</title>
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/assets/css/main.css" />
  <style>
    body { background: #f5f7fb; color: #1f2937; }
    .sidebar-nav-wrapper { position: fixed; inset: 0 auto 0 0; width: 260px; background: #fff; border-right: 1px solid #e5e7eb; }
    .sidebar-nav { padding: 24px 18px; }
    .sidebar-nav ul { list-style: none; padding: 0; margin: 0; }
    .nav-item { margin-bottom: 8px; }
    .nav-item a { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; color: #374151; text-decoration: none; font-weight: 600; }
    .nav-item.active a { background: #eef6ff; color: #0f59d6; }
    .main-wrapper { margin-left: 260px; min-height: 100vh; }
    .header { background: #fff; border-bottom: 1px solid #e5e7eb; }
    .container-fluid { padding: 20px 28px; }
    .card-style { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; box-shadow: 0 8px 18px rgba(15, 23, 42, 0.04); }
    .table { width: 100%; border-collapse: collapse; }
    .table th, .table td { padding: 14px 12px; border-bottom: 1px solid #eef2f7; text-align: left; }
    .badge { display: inline-block; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .badge.success { background: #dcfce7; color: #166534; }
    .badge.info { background: #dbeafe; color: #1d4ed8; }
    .badge.warning { background: #fef3c7; color: #92400e; }
    .badge.danger { background: #fee2e2; color: #991b1b; }
    .controls { display: flex; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
    .form-control { padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 10px; background: #fff; }
    @media (max-width: 900px) { .sidebar-nav-wrapper { display: none; } .main-wrapper { margin-left: 0; } }
  </style>
</head>
<body>
  <aside class="sidebar-nav-wrapper">
    <div class="navbar-logo" style="padding: 20px 18px 8px;">
      <a href="#"><img src="/assets/images/logo/ASnT5o01.svg" alt="PetHostelFlow" style="max-width: 150px;" /></a>
    </div>
    <nav class="sidebar-nav">
      <ul>
        <li class="nav-item"><a href="admin_dashboard.html"><span>Dashboard</span></a></li>
        <li class="nav-item active"><a href="manage_bookings.html"><span>Bookings</span></a></li>
      </ul>
    </nav>
  </aside>

  <main class="main-wrapper">
    <header class="header">
      <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center">
          <div><h2 class="mb-0">Manage Bookings</h2></div>
          <div class="d-flex align-items-center gap-3">
            <img src="/assets/images/profile/profile-image.png" alt="Profile" width="42" height="42" style="border-radius: 50%; border: 2px solid #e5e7eb;" />
            <div>
              <div class="fw-bold">admin@petstay.demo</div>
              <small class="text-muted">Admin</small>
            </div>
          </div>
        </div>
      </div>
    </header>

    <section class="table-components">
      <div class="container-fluid">
        <div class="controls mt-4">
          <input type="text" class="form-control" value="Search by name..." readonly style="max-width: 260px;" />
          <select class="form-control" style="max-width: 220px;" disabled><option>All Statuses</option></select>
          <select class="form-control" style="max-width: 220px;" disabled><option>All Species</option></select>
        </div>

        <div class="card-style p-3">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="mb-0">All Bookings</h6>
            <span class="badge info">Static demo</span>
          </div>
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Pet</th>
                  <th>Owner</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>1</td>
                  <td>Buddy</td>
                  <td>Emma Ross</td>
                  <td><span class="badge success">Confirmed</span></td>
                  <td>View</td>
                </tr>
                <tr>
                  <td>2</td>
                  <td>Milo</td>
                  <td>Jordan Lee</td>
                  <td><span class="badge warning">Pending</span></td>
                  <td>View</td>
                </tr>
                <tr>
                  <td>3</td>
                  <td>Harley</td>
                  <td>Sophie Kim</td>
                  <td><span class="badge info">Checked-In</span></td>
                  <td>View</td>
                </tr>
                <tr>
                  <td>4</td>
                  <td>Luna</td>
                  <td>Daniel Cruz</td>
                  <td><span class="badge danger">Cancelled</span></td>
                  <td>View</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer style="padding: 24px 28px 34px; color: #6b7280; text-align: left;">
    <div>Designed and Developed by Shivani Varu</div>
  </footer>
</body>
</html>
