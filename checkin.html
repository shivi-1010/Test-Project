<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetStay Check-In</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }
    .container {
      max-width: 720px;
      margin: 80px auto;
      padding: 32px 24px;
      background: #fff;
      border-radius: 18px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 10px 28px rgba(17, 24, 39, 0.06);
    }
    h2 {
      margin: 0 0 20px;
      text-align: center;
    }
    .alert {
      padding: 18px 20px;
      border-radius: 12px;
      background: #eef2ff;
      color: #312e81;
      border: 1px solid #c7d2fe;
      line-height: 1.6;
    }
    .status {
      margin-top: 18px;
      font-weight: 700;
      color: #1f2937;
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: #dbeafe;
      color: #1d4ed8;
      font-weight: 700;
    }
    .button {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 18px;
      border-radius: 10px;
      border: 0;
      background: #2563eb;
      color: #fff;
      font-weight: 700;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🐾 PetStay Check-In</h2>
    <div class="alert">
      <strong>Booking Found</strong><br />
      Owner: Emma Ross<br />
      Pet: Buddy (Dog)<br />
      Status: <span class="badge">Confirmed</span>
    </div>
    <div class="status">Static demo mode — check-in actions are disabled.</div>
    <button class="button" type="button">Staff: Continue to Check-In</button>
  </div>
</body>
</html>
